<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLXCKZ</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial Black', Impact, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            padding-bottom: 15vh;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 4em;
            font-weight: 900;
            letter-spacing: 14px;
            margin-right: -14px;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #FFD93D;
            font-family: system-ui, -apple-system, Arial, sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }

        .action-button {
            background-color: #f2f2f2;
            color: #121212;
            text-decoration: none;
            font-size: 1.1em;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 900;
            padding: 18px 20px;
            border-radius: 16px;
            text-transform: uppercase;
            transition: transform 0.15s ease, background-color 0.2s ease;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .action-button.rustore {
            background-color: #005FF9;
            color: #ffffff;
        }

        @media (hover: hover) {
            .action-button:hover {
                transform: scale(1.05);
                background-color: #ffffff;
            }

            .action-button.rustore:hover {
                background-color: #004ecc;
            }
        }

        .action-button:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .footer a {
            color: #555555;
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            text-decoration: underline;
            transition: color 0.2s;
        }

        @media (hover: hover) {
            .footer a:hover {
                color: #ffffff;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 14vw;
                letter-spacing: 10px;
                margin-right: -10px;
            }

            .subtitle {
                font-size: 1em;
                margin-bottom: 40px;
            }

            .action-button {
                font-size: 1em;
                padding: 16px 20px;
            }
        }
    </style>
</head>

<body>

    <h1>BLXCKZ</h1>

    <div class="subtitle" id="subtitle">
        ИНДИ-ГОЛОВОЛОМКА
    </div>

    <div class="buttons-container">

        <a href="https://github.com/rywe26s/rywe26s.github.io/releases/download/v1.1.0/BLXCKZ_1.1.0.apk"
            class="action-button" id="btn-apk">
            СКАЧАТЬ .APK
        </a>

        <a href="https://www.rustore.ru/catalog/app/com.rywes.blxckz" class="action-button rustore" id="btn-rustore">
            СКАЧАТЬ В RUSTORE
        </a>
    </div>

    <div class="footer">
        <a href="privacy.html" id="btn-privacy">Политика конфиденциальности</a>
    </div>

    <script>
        const userLang = navigator.language || navigator.userLanguage;

        if (!userLang.toLowerCase().startsWith('ru')) {
            document.getElementById('subtitle').innerText = 'INDIE PUZZLE GAME';
            document.getElementById('btn-apk').innerText = 'DOWNLOAD .APK';
            document.getElementById('btn-rustore').innerText = 'GET IT ON RUSTORE';
            document.getElementById('btn-privacy').innerText = 'Privacy Policy';
        }
    </script>

</body>

</html>
