<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLXCKZ — Block Puzzle</title>
  <style>
    :root {
      --bg-dark: #0e0e12;
      --card-bg: #181820;
      --yellow: #FFD93D;
      --green: #6BCB77;
      --blue: #4D96FF;
      --purple: #9B5DE5;
      --coral: #FF6B6B;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      color: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 20px 80px;
      box-sizing: border-box;
      text-align: center;
      position: relative;
    }

    .lang-selector {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .lang-selector select {
      background-color: var(--card-bg);
      color: #ffffff;
      border: 2px solid #2e2e3a;
      padding: 8px 14px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9em;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .lang-selector select:hover,
    .lang-selector select:focus {
      border-color: var(--yellow);
    }

    .lang-selector select option {
      background-color: var(--bg-dark);
      color: #ffffff;
    }

    .logo-blocks {
      display: inline-flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .logo-blocks span {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      display: inline-block;
    }

    h1 {
      font-family: 'Arial Black', Impact, system-ui, sans-serif;
      font-size: 4em;
      font-weight: 900;
      letter-spacing: 12px;
      margin: 0 -12px 10px 0;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    }

    .subtitle {
      color: var(--yellow);
      font-size: 0.95em;
      font-weight: 800;
      margin-bottom: 36px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
    }

    .section-label {
      font-size: 0.72em;
      font-weight: 800;
      letter-spacing: 2px;
      color: #777788;
      text-transform: uppercase;
      margin: 8px 0 2px;
    }

    .action-button {
      text-decoration: none;
      font-size: 0.98em;
      font-weight: 900;
      padding: 16px 20px;
      border-radius: 14px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: transform 0.14s ease, filter 0.18s ease;
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: 2px solid transparent;
    }

    /* Itch.io — Главная желтая кнопка (из палитры игры) */
    .action-button.itch {
      background-color: var(--yellow);
      color: #121212;
      box-shadow: 0 4px 0 #c9a318;
    }

    /* Playgama — Фиолетовый блок */
    .action-button.playgama {
      background-color: var(--card-bg);
      color: #ffffff;
      border-color: var(--purple);
      box-shadow: 0 4px 0 rgba(155, 93, 229, 0.35);
    }

    /* APK — Зеленый блок */
    .action-button.apk {
      background-color: var(--green);
      color: #121212;
      box-shadow: 0 4px 0 #469e52;
    }

    /* RuStore — Неоново-голубой блок */
    .action-button.rustore {
      background-color: var(--card-bg);
      color: #ffffff;
      border-color: var(--blue);
      box-shadow: 0 4px 0 rgba(77, 150, 255, 0.35);
    }

    /* AppGallery — Коралловый блок */
    .action-button.appgallery {
      background-color: var(--card-bg);
      color: #ffffff;
      border-color: var(--coral);
      box-shadow: 0 4px 0 rgba(255, 107, 107, 0.35);
    }

    @media (hover: hover) {
      .action-button:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
      }
    }

    .action-button:active {
      transform: translateY(2px);
      opacity: 0.92;
    }

    .footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .footer a {
      color: #666677;
      font-size: 0.85em;
      font-weight: 600;
      text-decoration: underline;
      transition: color 0.2s;
    }

    @media (hover: hover) {
      .footer a:hover {
        color: #ffffff;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 13vw;
        letter-spacing: 8px;
        margin-right: -8px;
      }

      .subtitle {
        font-size: 0.85em;
        margin-bottom: 28px;
      }

      .action-button {
        font-size: 0.92em;
        padding: 15px 18px;
      }

      .lang-selector {
        top: 14px;
        right: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="lang-selector">
    <select id="lang-switcher">
      <option value="ru">RU</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="pt">PT</option>
    </select>
  </div>

  <div class="logo-blocks" aria-hidden="true">
    <span style="background:#FF6B6B"></span>
    <span style="background:#FFD93D"></span>
    <span style="background:#6BCB77"></span>
    <span style="background:#4D96FF"></span>
    <span style="background:#9B5DE5"></span>
  </div>

  <h1>BLXCKZ</h1>

  <div class="subtitle" id="subtitle">
    ТАКТИЧЕСКИЙ ПАЗЛ С БЛОКАМИ
  </div>

  <div class="buttons-container">
    <div class="section-label" id="lbl-web">ИГРАТЬ ОНЛАЙН</div>

    <a href="https://rywe26ss.itch.io/blxckz" target="_blank" rel="noopener" class="action-button itch" id="btn-itch">
      ИГРАТЬ В БРАУЗЕРЕ (ITCH.IO)
    </a>

    <a href="https://playgama.com/game/blxckz-block-puzzle" target="_blank" rel="noopener"
      class="action-button playgama" id="btn-playgama">
      ИГРАТЬ НА PLAYGAMA
    </a>

    <div class="section-label" id="lbl-mobile">СКАЧАТЬ НА ANDROID</div>

    <a href="https://github.com/rywe26s/rywe26s.github.io/releases/download/v2.1.1/BLXCKZ_2.1.1.apk"
      class="action-button apk" id="btn-apk">
      СКАЧАТЬ .APK (v2.1.1)
    </a>

    <a href="https://www.rustore.ru/catalog/app/com.rywes.blxckz" target="_blank" rel="noopener"
      class="action-button rustore" id="btn-rustore">
      СКАЧАТЬ В RUSTORE
    </a>

    <a href="https://appgallery.huawei.com/#/app/C118492447" target="_blank" rel="noopener"
      class="action-button appgallery" id="btn-appgallery">
      СКАЧАТЬ В APPGALLERY
    </a>
  </div>

  <div class="footer">
    <a href="privacy.html" id="btn-privacy">Политика конфиденциальности</a>
  </div>

  <script>
    const translations = {
      ru: {
        subtitle: "ТАКТИЧЕСКИЙ ПАЗЛ С БЛОКАМИ",
        lblWeb: "ИГРАТЬ ОНЛАЙН",
        btnItch: "ИГРАТЬ В БРАУЗЕРЕ (ITCH.IO)",
        btnPlaygama: "ИГРАТЬ НА PLAYGAMA",
        lblMobile: "СКАЧАТЬ НА ANDROID",
        btnApk: "СКАЧАТЬ .APK (v2.1.1)",
        btnRustore: "СКАЧАТЬ В RUSTORE",
        btnAppGallery: "СКАЧАТЬ В APPGALLERY",
        btnPrivacy: "Политика конфиденциальности"
      },
      en: {
        subtitle: "TACTICAL BLOCK PUZZLE",
        lblWeb: "PLAY IN BROWSER",
        btnItch: "PLAY ON ITCH.IO",
        btnPlaygama: "PLAY ON PLAYGAMA",
        lblMobile: "ANDROID DOWNLOAD",
        btnApk: "DOWNLOAD .APK (v2.1.1)",
        btnRustore: "GET IT ON RUSTORE",
        btnAppGallery: "GET IT ON APPGALLERY",
        btnPrivacy: "Privacy Policy"
      },
      es: {
        subtitle: "ROMPECABEZAS TÁCTICO",
        lblWeb: "JUGAR EN EL NAVEGADOR",
        btnItch: "JUGAR EN ITCH.IO",
        btnPlaygama: "JUGAR EN PLAYGAMA",
        lblMobile: "DESCARGAR EN ANDROID",
        btnApk: "DESCARGAR .APK (v2.1.1)",
        btnRustore: "DESCARGAR EN RUSTORE",
        btnAppGallery: "DESCARGAR EN APPGALLERY",
        btnPrivacy: "Política de privacidad"
      },
      pt: {
        subtitle: "QUEBRA-CABEÇA TÁTICO",
        lblWeb: "JOGAR NO NAVEGADOR",
        btnItch: "JOGAR NO ITCH.IO",
        btnPlaygama: "JOGAR NA PLAYGAMA",
        lblMobile: "BAIXAR NO ANDROID",
        btnApk: "BAIXAR .APK (v2.1.1)",
        btnRustore: "BAIXAR NO RUSTORE",
        btnAppGallery: "BAIXAR NA APPGALLERY",
        btnPrivacy: "Política de Privacidade"
      }
    };

    const langSwitcher = document.getElementById('lang-switcher');

    function applyLanguage(lang) {
      if (!translations[lang]) lang = 'en';

      const t = translations[lang];
      document.getElementById('subtitle').innerText = t.subtitle;
      document.getElementById('lbl-web').innerText = t.lblWeb;
      document.getElementById('btn-itch').innerText = t.btnItch;
      document.getElementById('btn-playgama').innerText = t.btnPlaygama;
      document.getElementById('lbl-mobile').innerText = t.lblMobile;
      document.getElementById('btn-apk').innerText = t.btnApk;
      document.getElementById('btn-rustore').innerText = t.btnRustore;
      document.getElementById('btn-appgallery').innerText = t.btnAppGallery;
      document.getElementById('btn-privacy').innerText = t.btnPrivacy;

      langSwitcher.value = lang;
      document.documentElement.lang = lang;
    }

    let currentLang = localStorage.getItem('blxckz_lang');

    if (!currentLang) {
      currentLang = (navigator.language || navigator.userLanguage || 'en').slice(0, 2).toLowerCase();
    }

    applyLanguage(currentLang);

    langSwitcher.addEventListener('change', function (e) {
      const selectedLang = e.target.value;
      applyLanguage(selectedLang);
      localStorage.setItem('blxckz_lang', selectedLang);
    });
  </script>
</body>

</html>
