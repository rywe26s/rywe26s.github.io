<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLXCKZ</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial Black', Impact, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            padding-bottom: 15vh;
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        .lang-selector {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .lang-selector select {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #555555;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .lang-selector select:hover {
            border-color: #FFD93D;
        }

        .lang-selector select option {
            background-color: #121212;
            color: #ffffff;
        }

        h1 {
            font-size: 4em;
            font-weight: 900;
            letter-spacing: 14px;
            margin-right: -14px;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #FFD93D;
            font-family: system-ui, -apple-system, Arial, sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }

        .action-button {
            background-color: #f2f2f2;
            color: #121212;
            text-decoration: none;
            font-size: 1.1em;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 900;
            padding: 18px 20px;
            border-radius: 16px;
            text-transform: uppercase;
            transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .action-button.rustore {
            background-color: #005FF9;
            color: #ffffff;
        }

        .action-button.appgallery {
            background-color: #CF0A2C;
            color: #ffffff;
        }

        @media (hover: hover) {
            .action-button:hover {
                transform: scale(1.05);
                background-color: #ffffff;
            }

            .action-button.rustore:hover {
                background-color: #004ecc;
            }

            .action-button.appgallery:hover {
                background-color: #a80824;
            }
        }

        .action-button:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .footer a {
            color: #555555;
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            text-decoration: underline;
            transition: color 0.2s;
        }

        @media (hover: hover) {
            .footer a:hover {
                color: #ffffff;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 14vw;
                letter-spacing: 10px;
                margin-right: -10px;
            }

            .subtitle {
                font-size: 1em;
                margin-bottom: 40px;
            }

            .action-button {
                font-size: 1em;
                padding: 16px 20px;
            }

            .lang-selector {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="lang-selector">
        <select id="lang-switcher">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="pt">PT</option>
        </select>
    </div>

    <h1>BLXCKZ</h1>

    <div class="subtitle" id="subtitle">
        ИНДИ-ГОЛОВОЛОМКА
    </div>

    <div class="buttons-container">
        <a href="https://github.com/rywe26s/rywe26s.github.io/releases/download/v1.3.0/BLXCKZ.v1.3.0.apk"
            class="action-button" id="btn-apk">
            СКАЧАТЬ .APK
        </a>

        <a href="https://www.rustore.ru/catalog/app/com.rywes.blxckz" class="action-button rustore" id="btn-rustore">
            СКАЧАТЬ В RUSTORE
        </a>

        <a href="https://appgallery.huawei.com/#/app/C118492447" class="action-button appgallery" id="btn-appgallery">
            СКАЧАТЬ В APPGALLERY
        </a>
    </div>

    <div class="footer">
        <a href="privacy.html" id="btn-privacy">Политика конфиденциальности</a>
    </div>

    <script>
        const translations = {
            ru: {
                subtitle: "ИНДИ-ГОЛОВОЛОМКА",
                btnApk: "СКАЧАТЬ .APK",
                btnRustore: "СКАЧАТЬ В RUSTORE",
                btnAppGallery: "СКАЧАТЬ В APPGALLERY",
                btnPrivacy: "Политика конфиденциальности"
            },
            en: {
                subtitle: "INDIE PUZZLE GAME",
                btnApk: "DOWNLOAD .APK",
                btnRustore: "GET IT ON RUSTORE",
                btnAppGallery: "GET IT ON APPGALLERY",
                btnPrivacy: "Privacy Policy"
            },
            es: {
                subtitle: "ROMPECABEZAS INDIE",
                btnApk: "DESCARGAR .APK",
                btnRustore: "DESCARGAR EN RUSTORE",
                btnAppGallery: "DESCARGAR EN APPGALLERY",
                btnPrivacy: "Política de privacidad"
            },
            pt: {
                subtitle: "QUEBRA-CABEÇA INDIE",
                btnApk: "BAIXAR .APK",
                btnRustore: "BAIXAR NO RUSTORE",
                btnAppGallery: "BAIXAR NO APPGALLERY",
                btnPrivacy: "Política de Privacidade"
            }
        };

        const langSwitcher = document.getElementById('lang-switcher');

        function applyLanguage(lang) {
            if (!translations[lang]) lang = 'en';

            const t = translations[lang];
            document.getElementById('subtitle').innerText = t.subtitle;
            document.getElementById('btn-apk').innerText = t.btnApk;
            document.getElementById('btn-rustore').innerText = t.btnRustore;
            document.getElementById('btn-appgallery').innerText = t.btnAppGallery;
            document.getElementById('btn-privacy').innerText = t.btnPrivacy;

            langSwitcher.value = lang;
            document.documentElement.lang = lang;
        }

        let currentLang = localStorage.getItem('blxckz_lang');

        if (!currentLang) {
            currentLang = (navigator.language || navigator.userLanguage).slice(0, 2).toLowerCase();
        }

        applyLanguage(currentLang);

        langSwitcher.addEventListener('change', function (e) {
            const selectedLang = e.target.value;
            applyLanguage(selectedLang);
            localStorage.setItem('blxckz_lang', selectedLang);
        });
    </script>

</body>
</html>
