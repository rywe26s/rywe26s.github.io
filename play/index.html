<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Test Environment Closed</title>
    <script>

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });

            localStorage.clear();
            sessionStorage.clear();
        }
    </script>
</head>

<body style="background-color: #121212; color: white; text-align: center; padding: 50px; font-family: sans-serif;">
    <h2>Test environment has been permanently closed.</h2>
    <p>The web test build is removed. The actual game is a native compiled Android application.</p>
</body>

</html>
